services:
  # ============================================================================
  # PostgreSQL Database + PostGIS Extension
  # ============================================================================
  postgres:
    image: postgis/postgis:16-3.4
    container_name: agrilog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agrilog_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./agrilog_schema.sql:/docker-entrypoint-initdb.d/01_agrilog_schema.sql:ro
      - ./agrilog_seed.sql:/docker-entrypoint-initdb.d/02_agrilog_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - agrilog-network

  # ============================================================================
  # Redis Cache & Refresh Token Storage (In-memory Store)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: agrilog-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - agrilog-network

volumes:
  postgres_data:
    name: agrilog_postgres_data
  redis_data:
    name: agrilog_redis_data

networks:
  agrilog-network:
    name: agrilog_network
    driver: bridge
