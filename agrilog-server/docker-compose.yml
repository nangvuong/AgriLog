services:
  # ============================================================================
  # 1. PostgreSQL Database + PostGIS Extension
  # ============================================================================
  postgres:
    image: postgis/postgis:16-3.4
    container_name: agrilog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agrilog_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - agrilog-network

volumes:
  postgres_data:
    name: agrilog_postgres_data

networks:
  agrilog-network:
    name: agrilog_network
    driver: bridge
